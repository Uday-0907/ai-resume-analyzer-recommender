  <text x="657" y="166" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Metric cards</text>
  <text x="657" y="178" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">🥇 🥈 🥉 with %</text>

  <!-- Gauge Chart -->
  <rect x="754" y="134" width="158" height="52" rx="5" fill="#DDEEFF" stroke="#2c7bb6"/>
  <text x="833" y="152" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">📊 Match Score Gauge</text>
  <text x="833" y="166" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Plotly indicator chart</text>
  <text x="833" y="178" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">0 – 100 %</text>

  <!-- Skills by Category -->
  <rect x="578" y="196" width="158" height="52" rx="5" fill="#DDEEFF" stroke="#2c7bb6"/>
  <text x="657" y="214" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">🧠 Extracted Skills</text>
  <text x="657" y="228" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Grouped by category</text>
  <text x="657" y="240" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">from dictionary</text>

  <!-- Skill Gap + Roadmap -->
  <rect x="754" y="196" width="158" height="52" rx="5" fill="#DDEEFF" stroke="#2c7bb6"/>
  <text x="833" y="214" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">🔍 Skill-Gap + Roadmap</text>
  <text x="833" y="228" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Found vs. Missing</text>
  <text x="833" y="240" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">4-Week plan display</text>

  <!-- Download -->
  <rect x="578" y="258" width="334" height="52" rx="5" fill="#DDEEFF" stroke="#2c7bb6"/>
  <text x="745" y="278" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">📥 Download Analysis Report (.txt)</text>
  <text x="745" y="293" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Match score · Top 3 roles · Skill gap · 4-Week roadmap</text>

  <!-- Pipeline → Dashboard arrows -->
  <line x1="520" y1="370" x2="600" y2="190" stroke="#2c7bb6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="520" y1="466" x2="657" y2="196" stroke="#2c7bb6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="520" y1="560" x2="754" y2="210" stroke="#2c7bb6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CLUSTER: Optional AI -->
  <rect x="560" y="512" width="370" height="100" rx="8" fill="#F8F0FF" stroke="#9B59B6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="745" y="532" font-family="Helvetica" font-size="12" font-weight="bold" fill="#9B59B6" text-anchor="middle">Optional AI Feedback  (ai_feedback.py)</text>

  <rect x="578" y="542" width="150" height="56" rx="5" fill="#EDD6FF" stroke="#9B59B6"/>
  <text x="653" y="560" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">🤖 ai_feedback.py</text>
  <text x="653" y="575" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Controlled prompt</text>
  <text x="653" y="588" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">(skills only — no PII)</text>

  <ellipse cx="830" cy="570" rx="80" ry="30" fill="#EDD6FF" stroke="#9B59B6"/>
  <text x="830" y="567" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">✨ Gemini Flash API</text>
  <text x="830" y="580" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Google AI Studio</text>

  <line x1="728" y1="570" x2="750" y2="570" stroke="#9B59B6" stroke-width="1.5" marker-end="url(#arrow-dashed)"/>
  <line x1="750" y1="558" x2="728" y2="554" stroke="#9B59B6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-dashed)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CLUSTER: Output -->
  <rect x="560" y="630" width="370" height="70" rx="8" fill="#F5F5F5" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="745" y="650" font-family="Helvetica" font-size="12" font-weight="bold" fill="#7F8C8D" text-anchor="middle">Output</text>
  <rect x="600" y="658" width="290" height="32" rx="5" fill="#EEEEEE" stroke="#7F8C8D"/>
  <text x="745" y="672" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">📄 resume_analysis_*.txt  (reports/ directory)</text>
  <text x="745" y="684" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">Downloadable analysis report</text>

  <!-- Dashboard → Output -->
  <line x1="745" y1="310" x2="745" y2="658" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Legend -->
  <rect x="20" y="730" width="520" height="72" rx="6" fill="#FAFAFA" stroke="#CCC"/>
  <text x="30" y="748" font-family="Helvetica" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <line x1="30" y1="762" x2="70" y2="762" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="78" y="766" font-family="Helvetica" font-size="10" fill="#333">Data flow (solid)</text>
  <line x1="180" y1="762" x2="220" y2="762" stroke="#555" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="228" y="766" font-family="Helvetica" font-size="10" fill="#333">Optional / async flow</text>
  <line x1="360" y1="762" x2="400" y2="762" stroke="#C0392B" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="408" y="766" font-family="Helvetica" font-size="10" fill="#333">Data layer load</text>
  <rect x="30" y="776" width="12" height="12" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="48" y="786" font-family="Helvetica" font-size="10" fill="#333">NLP Pipeline</text>
  <rect x="130" y="776" width="12" height="12" fill="#DDEEFF" stroke="#2c7bb6"/>
  <text x="148" y="786" font-family="Helvetica" font-size="10" fill="#333">Streamlit UI</text>
  <rect x="240" y="776" width="12" height="12" fill="#FFD6D6" stroke="#C0392B"/>
  <text x="258" y="786" font-family="Helvetica" font-size="10" fill="#333">Data Layer</text>
  <rect x="350" y="776" width="12" height="12" fill="#EDD6FF" stroke="#9B59B6"/>
  <text x="368" y="786" font-family="Helvetica" font-size="10" fill="#333">Optional AI</text>
</svg>
