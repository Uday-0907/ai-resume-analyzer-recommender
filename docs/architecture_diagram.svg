<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1100" height="820" viewBox="0 0 1100 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9B59B6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="white" rx="8"/>

  <!-- Title -->
  <text x="550" y="36" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold"
        text-anchor="middle" fill="#222">AI Resume Analyzer &amp; Job Recommendation System — Architecture</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CLUSTER: User Input -->
  <rect x="20" y="58" width="220" height="110" rx="8" fill="#D6E8FF" stroke="#4A90D9" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="130" y="78" font-family="Helvetica" font-size="12" font-weight="bold" fill="#4A90D9" text-anchor="middle">User Input</text>
  <!-- User node -->
  <rect x="40" y="88" width="80" height="50" rx="6" fill="#D6E8FF" stroke="#4A90D9"/>
  <text x="80" y="110" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#222">👤 User</text>
  <text x="80" y="126" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">(Browser)</text>
  <!-- Upload node -->
  <rect x="140" y="88" width="84" height="62" rx="6" fill="#D6E8FF" stroke="#4A90D9"/>
  <text x="182" y="107" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#222">📄 Uploader</text>
  <text x="182" y="121" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">PDF / DOCX</text>
  <text x="182" y="135" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">Max 5 MB</text>
  <!-- edge User->Uploader -->
  <line x1="120" y1="113" x2="140" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CLUSTER: NLP Pipeline -->
  <rect x="260" y="58" width="280" height="580" rx="8" fill="#F5FFF5" stroke="#27A65A" stroke-width="2"/>
  <text x="400" y="78" font-family="Helvetica" font-size="13" font-weight="bold" fill="#27A65A" text-anchor="middle">NLP Processing Pipeline</text>

  <!-- Validation -->
  <rect x="280" y="92" width="240" height="56" rx="6" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="400" y="112" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">🛡️ File Validation</text>
  <text x="400" y="128" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">extension check + size check</text>

  <!-- resume_parser -->
  <rect x="280" y="168" width="240" height="66" rx="6" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="400" y="188" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">📖 resume_parser.py</text>
  <text x="400" y="204" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">pypdf (PDF)</text>
  <text x="400" y="218" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">python-docx (DOCX)</text>

  <!-- text_cleaner -->
  <rect x="280" y="254" width="240" height="66" rx="6" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="400" y="274" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">🧹 text_cleaner.py</text>
  <text x="400" y="290" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">Lowercase + strip symbols</text>
  <text x="400" y="304" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">Preserves C++, C#, .NET</text>

  <!-- skill_extractor -->
  <rect x="280" y="340" width="240" height="66" rx="6" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="400" y="360" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">🔎 skill_extractor.py</text>
  <text x="400" y="376" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">Phrase matching vs.</text>
  <text x="400" y="390" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">skill_dictionary.csv (57 skills)</text>

  <!-- job_matcher -->
  <rect x="280" y="426" width="240" height="80" rx="6" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="400" y="446" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">⚖️ job_matcher.py</text>
  <text x="400" y="462" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">TF-IDF Vectoriser</text>
  <text x="400" y="476" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">Cosine Similarity</text>
  <text x="400" y="490" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">70% skill overlap + 30% TF-IDF</text>

  <!-- roadmap_generator -->
  <rect x="280" y="526" width="240" height="80" rx="6" fill="#CCFFCC" stroke="#27A65A"/>
  <text x="400" y="546" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">🗺️ roadmap_generator.py</text>
  <text x="400" y="562" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">analyze_skill_gaps()</text>
  <text x="400" y="576" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">generate_learning_roadmap()</text>
  <text x="400" y="590" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#555">4-week structured plan</text>

  <!-- Pipeline internal arrows -->
  <line x1="400" y1="148" x2="400" y2="168" stroke="#27A65A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="234" x2="400" y2="254" stroke="#27A65A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="320" x2="400" y2="340" stroke="#27A65A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="406" x2="400" y2="426" stroke="#27A65A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="506" x2="400" y2="526" stroke="#27A65A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Upload → Validation -->
  <line x1="224" y1="113" x2="280" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="110" font-family="Helvetica" font-size="9" fill="#555">bytes</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CLUSTER: Data Layer -->
  <rect x="560" y="330" width="200" height="160" rx="8" fill="#FFF5F5" stroke="#C0392B" stroke-width="2"/>
  <text x="660" y="350" font-family="Helvetica" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">Data Layer</text>

  <!-- skill_dictionary.csv -->
  <ellipse cx="660" cy="390" rx="85" ry="28" fill="#FFD6D6" stroke="#C0392B"/>
  <text x="660" y="387" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">skill_dictionary.csv</text>
  <text x="660" y="400" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">57 skills / 12 categories</text>

  <!-- job_roles.csv -->
  <ellipse cx="660" cy="460" rx="85" ry="28" fill="#FFD6D6" stroke="#C0392B"/>
  <text x="660" y="457" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#222">job_roles.csv</text>
  <text x="660" y="470" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">8 roles + descriptions</text>

  <!-- Data → Pipeline arrows (dashed) -->
  <line x1="575" y1="390" x2="520" y2="373" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="575" y1="460" x2="520" y2="466" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="540" y="382" font-family="Helvetica" font-size="9" fill="#C0392B">loads</text>
  <text x="527" y="474" font-family="Helvetica" font-size="9" fill="#C0392B">loads</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CLUSTER: Streamlit Dashboard -->
  <rect x="560" y="58" width="370" height="268" rx="8" fill="#F0F8FF" stroke="#2c7bb6" stroke-width="2"/>
  <text x="745" y="78" font-family="Helvetica" font-size="13" font-weight="bold" fill="#2c7bb6" text-anchor="middle">Streamlit Dashboard  (app.py)</text>

  <!-- Responsible AI Banner -->
  <rect x="578" y="88" width="334" height="36" rx="5" fill="#FFF0D6" stroke="#E07B00"/>
  <text x="745" y="104" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#E07B00">🔒 Responsible AI Banner</text>
  <text x="745" y="117" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#555">No demographics scored — skills/projects/experience only</text>

  <!-- Top 3 Roles -->
  <rect x="578" y="134" width="158" height="52" rx="5" fill="#DDEEFF" stroke="#2c7bb6"/>
